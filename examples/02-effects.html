<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>LavaOrb v3b — Effects Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, sans-serif;
    background: #0d1117; color: #e6edf3;
    min-height: 100vh; padding: 40px;
  }
  h1 { font-size: 22px; margin-bottom: 8px; }
  .hint { font-size: 13px; opacity: 0.6; margin-bottom: 24px; }

  .controls {
    max-width: 700px; margin: 0 auto 20px;
    display: flex; gap: 12px; align-items: center;
    padding: 12px 16px; border-radius: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .controls label { font-size: 13px; }
  .controls button {
    padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;
    background: rgba(255,255,255,0.12); color: inherit;
    border: 1px solid rgba(255,255,255,0.22);
  }
  .controls button.active { background: rgba(100,150,255,0.25); color: #9dc3ff; }

  .slider-card {
    max-width: 700px; margin: 0 auto 20px;
    padding: 16px 20px; border-radius: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .slider-card .label {
    display: flex; justify-content: space-between;
    font-size: 13px; opacity: 0.8; margin-bottom: 12px;
  }
  .val { font-family: monospace; padding: 2px 8px; border-radius: 4px; background: rgba(255,255,255,0.1); }

  .lava-orb-wrapper { padding: 24px 0; }

  input[type=range] {
    width: 100%; height: 10px;
    border-radius: 5px;
    background: rgba(255,255,255,0.08);
    appearance: none; -webkit-appearance: none;
    cursor: pointer; outline: none;
  }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 60px; height: 60px; border-radius: 50%; background: transparent; opacity: 0; cursor: grab; }
  input[type=range]::-moz-range-thumb { -moz-appearance: none; width: 60px; height: 60px; border-radius: 50%; background: transparent; opacity: 0; border: none; cursor: grab; }
</style>
</head>
<body data-theme="dark">

<h1>LavaOrb v3b — Effects Demo</h1>
<p class="hint">Session B: fire-particles, fire-doom, frost mixins. Подвигай ползунки — val 1-2 даст иней, val 9-10 даст огонь.</p>

<div class="controls">
  <label>Fire style:</label>
  <button id="btn-particles" class="active">Particles</button>
  <button id="btn-doom">DOOM cellular</button>
  <span style="flex: 1"></span>
  <button id="btn-explode">💥 Explode all</button>
</div>

<div class="slider-card">
  <div class="label"><span>Frost (val 1-2 triggers snowflakes)</span><span class="val" id="v1">1</span></div>
  <input type="range" id="s1" min="1" max="10" value="1">
</div>

<div class="slider-card">
  <div class="label"><span>Neutral (val 3-8 just liquid)</span><span class="val" id="v2">5</span></div>
  <input type="range" id="s2" min="1" max="10" value="5">
</div>

<div class="slider-card">
  <div class="label"><span>Fire (val 9-10 triggers flames)</span><span class="val" id="v3">10</span></div>
  <input type="range" id="s3" min="1" max="10" value="10">
</div>

<!-- Работает через file:// — IIFE bundle -->
<script src="../dist/lava-orb.js"></script>
<script>
  const sliders = [
    ['s1', 'v1'],
    ['s2', 'v2'],
    ['s3', 'v3']
  ];

  const orbs = sliders.map(([sId, vId]) => {
    const input = document.getElementById(sId);
    const valDisp = document.getElementById(vId);
    return LavaOrb.attach(input, {
      size: 60,
      onChange: (v) => { valDisp.textContent = v; }
    });
  });

  // Fire style toggle
  const btnP = document.getElementById('btn-particles');
  const btnD = document.getElementById('btn-doom');
  btnP.addEventListener('click', () => {
    orbs.forEach(h => h.setFireStyle('particles'));
    btnP.classList.add('active');
    btnD.classList.remove('active');
  });
  btnD.addEventListener('click', () => {
    orbs.forEach(h => h.setFireStyle('doom'));
    btnD.classList.add('active');
    btnP.classList.remove('active');
  });

  document.getElementById('btn-explode').addEventListener('click', () => {
    orbs.forEach(h => h.explode());
  });

  console.log('Demo ready. Attached:', orbs.length, 'orbs. Version:', LavaOrb.VERSION);
</script>

</body>
</html>
